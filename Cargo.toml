[package]
name = "neiro"
version = "0.1.0"
edition = "2024"
description = "Laptop speaker enhancement for PipeWire, using the laptop's own Dolby DAX3 tuning"
authors = ["Wolf Yuan <me@wolf-yuan.dev>"]
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1.0.104"
arc-swap = "1.9.3"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
hound = "3.5.1"
libc = "0.2.191"
pipewire = { version = "0.10.1", features = ["v0_3_49"] }
quick-xml = "0.42.0"
ratatui = "0.30.2"
realfft = "3.5.0"
rtrb = "0.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
